name: Daily Weather Bot

on:
  schedule:
    # Runs every day at 6:00 AM CST (12:00 PM UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  send_weather:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
        
      - name: Verify secrets
        run: |
          echo "GMAIL_ADDRESS set: ${#GMAIL_ADDRESS}"
          echo "GMAIL_PASSWORD set: ${#GMAIL_PASSWORD}"
          echo "RECIPIENT_EMAIL: $RECIPIENT_EMAIL"
      
      - name: Run weather bot
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python weather_bot.py
